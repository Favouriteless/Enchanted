name: Bug Report
description: File a bug report.
title: "[BUG]: "
labels: ["type:bug"]
assignees:
  - Favouriteless
body:
  - type: checkboxes
    id: unique-issue
    attributes:
      label: Please confirm the following
      options:
        - label: This bug is not in another [current issue](https://github.com/Favouriteless/Enchanted/issues)
          required: true
        - label: This report is not a general support request. If it is, join the [Discord](https://discord.gg/UkVgJ9nb5y)
          required: true
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: What minecraft version did the bug occur on?
      options:
        - 1.21.1
        - 1.20.1
        - 1.19.2
        - 1.18.2
        - 1.16.5
    validations:
      required: true
  - type: dropdown
    id: mod-loader
    attributes:
      label: Mod loader
      description: Which mod loader did the bug occur on?
      options:
        - NeoForge
        - Fabric
        - Forge (1.20.1 and below)
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Which version of Enchanted did the bug occur on?
      placeholder: (e.g. 3.0.4)
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: What happened? How? Give as much detail as you can about the bug.
    validations:
      required: true
  - type: upload
    id: log
    attributes:
      label: Game Log
      description: Upload your latest.log file found in the logs folder. **This should NOT be the crash report.**
    validations:
      required: true
      accept: ".log,.txt,.zip"
  - type: dropdown
    id: additional-mods
    attributes:
      label: Additional mods
      description: Did you have any mods installed other than Enchanted and its dependencies?
      options:
        - "Yes"
        - "No"
    validations:
      required: true